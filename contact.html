<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Jubo Shokti Debidwar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Jubo Shokti Debidwar</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="activities.html">Activities</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="page-section">
    <h2>Contact Us</h2>
    <p>Have a question or want to get involved? Reach out.</p>
  </section>

  <!-- সংগঠনের ঠিকানা/ফোন/ইমেইল - placeholder, পরে বদলে দিও -->
  <section class="contact-info">
    <p><strong>Address:</strong> Debidwar, Comilla, Bangladesh</p>
    <p><strong>Phone:</strong> +880 1XXX-XXXXXX</p>
    <p><strong>Email:</strong> info@juboshokti-debidwar.org</p>
  </section>

  <!-- ফর্ম: এখনো কোনো সার্ভার/ইমেইল সিস্টেমের সাথে কানেক্টেড না, শুধু গঠন -->
  <form>
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit" class="btn">Send Message</button>
  </form>

  <footer>
    <p>&copy; 2026 Jubo Shokti Debidwar. All rights reserved.</p>
  </footer>

</body>
</html>
